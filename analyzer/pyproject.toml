[project]
name = "jote-analyzer"
version = "0.1.0"
description = "Análisis post-vuelo del avión JOTE: logs Garmin GDU 460 contra límites mandatorios (Rotax 912 / Manual JOTE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = [
    "markdown>=3.6",
    "weasyprint>=62",
    "matplotlib>=3.8",
]

[project.scripts]
jote-analyzer = "jote_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jote_analyzer"]
