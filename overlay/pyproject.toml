[project]
name = "flighthud"
version = "0.1.0"
description = "Generate transparent HUD overlay frames from Garmin G3X/GDU CSV logs"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hernan Sans" },
    { name = "José F. Romaniello" },
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=9.0",
    "typer>=0.12",
]

[project.scripts]
flighthud = "flighthud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flighthud"]
