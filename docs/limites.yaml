# Límites mandatorios — fuente de verdad para el motor de comparación
#
# Cada entrada DEBE citar manual + edición/revisión + página/sección.
# Este archivo arranca como esquema/placeholder: se completa a medida que se
# extraen los valores reales de los manuales (Rotax OM 912 Ed.4, Manual JOTE rev.1,
# G3X Touch Pilot's Guide, Manual de Ensayos en Vuelo).
#
# Estructura de cada parámetro:
#   campo_csv:        nombre de la columna esperada en el log del GDU 460
#   unidad:           unidad de medida
#   limites:          min / max / max_continuo / max_transitorio (lo que aplique)
#   fuente:           manual, edición/revisión, página o sección

motor:
  rpm:
    campo_csv: null          # TODO: completar con nombre real de columna del CSV
    unidad: rpm
    limites:
